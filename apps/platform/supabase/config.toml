# Supabase CLI local dev config
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "mni-gudang"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"
heartbeat_interval_ms = 300000
poll_interval_ms = 100
poll_max_changes = 100
poll_max_record_bytes = 1048576

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
mailer_secure_email_change_enabled = true
max_frequency = "1s"

[auth.email.smtp]
host = "127.0.0.1"
port = 2500
admin_email = "admin@example.com"
sender_name = "MNI Gudang"

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }} ."

[auth.external.apple]
enabled = false
[auth.external.azure]
enabled = false
[auth.external.bitbucket]
enabled = false
[auth.external.discord]
enabled = false
[auth.external.facebook]
enabled = false
[auth.external.github]
enabled = false
[auth.external.gitlab]
enabled = false
[auth.external.google]
enabled = false
[auth.external.keycloak]
enabled = false
[auth.external.linkedin_oidc]
enabled = false
[auth.external.notion]
enabled = false
[auth.external.twitch]
enabled = false
[auth.external.twitter]
enabled = false
[auth.external.slack_oidc]
enabled = false
[auth.external.spotify]
enabled = false
[auth.external.workos]
enabled = false
[auth.external.zoom]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
port = 54327
vector_port = 54328
backend = "postgres"
