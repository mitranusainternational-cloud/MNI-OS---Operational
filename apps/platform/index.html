<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNI Gudang &amp; Logistik</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <!--
    MNI Gudang - Local Dev Version
    Stack: Vanilla JS + Supabase + Vite (dev) / Static (prod)

    The main app logic lives in app.js (copied from mni-gudang.html).
    This file just wires up the env, loads the Supabase adapter,
    and provides the auth UI.
  -->

  <!-- Inject env vars (Vite replaces window.__ENV at build time) -->
  <script>
    window.__ENV = window.__ENV || {
      SUPABASE_URL: '%VITE_SUPABASE_URL%',
      SUPABASE_ANON_KEY: '%VITE_SUPABASE_ANON_KEY%',
      APP_VERSION: '%VITE_APP_VERSION%',
      LOCAL_MOCK: '%VITE_LOCAL_MOCK%'
    };
  </script>

  <!-- Supabase adapter: inject BEFORE the main app script -->
  <script type="module" src="/src/lib/claude-adapter.js"></script>
</head>
<body>
  <!-- Auth gate overlay (shown when not logged in) -->
  <div id="auth-gate" style="
    display:none;
    position:fixed;inset:0;
    background:var(--bg, #EEF2F8);
    z-index:9999;
    display:flex;align-items:center;justify-content:center;
  ">
    <div style="
      background:#fff;
      border-radius:16px;
      padding:40px 48px;
      max-width:400px;width:100%;
      box-shadow:0 8px 32px rgba(16,32,58,.12);
      text-align:center;
    ">
      <div style="font-size:32px;margin-bottom:12px">🏭</div>
      <h1 style="
        font-family:'Barlow Semi Condensed',sans-serif;
        font-size:24px;font-weight:700;
        color:#12203A;margin:0 0 4px
      ">MNI Gudang</h1>
      <p style="color:#5B6B85;font-size:14px;margin:0 0 32px">
        Masuk untuk melanjutkan
      </p>

      <div id="auth-email-step">
        <input id="auth-email" type="email"
          placeholder="Email address"
          style="
            width:100%;box-sizing:border-box;
            padding:10px 14px;border:1.5px solid #DCE3EE;
            border-radius:8px;font-size:14px;
            font-family:'IBM Plex Sans',sans-serif;
            outline:none;margin-bottom:12px;
          "
          onkeydown="if(event.key==='Enter') document.getElementById('auth-btn').click()"
        >
        <button id="auth-btn"
          onclick="authSendOTP()"
          style="
            width:100%;padding:11px;
            background:#1F5FD6;color:#fff;
            border:none;border-radius:8px;
            font-size:14px;font-weight:600;cursor:pointer;
          "
        >Kirim Kode Masuk</button>
        <!-- Cadangan bila email OTP bermasalah (batas kirim email atau SMTP). Disembunyikan di mode mock. -->
        <div id="auth-pw-block" style="margin-top:14px">
          <a href="#" onclick="document.getElementById('auth-pw-fields').style.display='block';this.style.display='none';return false"
            style="font-size:13px;color:#1F5FD6;text-decoration:none">Masuk dengan password</a>
          <div id="auth-pw-fields" style="display:none;margin-top:10px">
            <input id="auth-password" type="password" placeholder="Password"
              autocomplete="current-password"
              style="
                width:100%;box-sizing:border-box;
                padding:10px 14px;border:1.5px solid #DCE3EE;
                border-radius:8px;font-size:14px;
                font-family:'IBM Plex Sans',sans-serif;
                outline:none;margin-bottom:12px;
              "
              onkeydown="if(event.key==='Enter') authPasswordLogin()"
            >
            <button id="auth-pw-btn" onclick="authPasswordLogin()"
              style="
                width:100%;padding:11px;
                background:#fff;color:#1F5FD6;
                border:1.5px solid #1F5FD6;border-radius:8px;
                font-size:14px;font-weight:600;cursor:pointer;
              "
            >Masuk</button>
            <a href="#" onclick="authForgot();return false"
              style="display:inline-block;margin-top:10px;font-size:13px;color:#5B6B85;text-decoration:none">Lupa password?</a>
          </div>
        </div>
      </div>

      <div id="auth-newpw-step" style="display:none">
        <p style="color:#5B6B85;font-size:13px;margin:0 0 12px">Buat password baru (minimal 8 karakter)</p>
        <input id="auth-newpw" type="password" placeholder="Password baru" autocomplete="new-password"
          style="width:100%;box-sizing:border-box;padding:10px 14px;border:1.5px solid #DCE3EE;border-radius:8px;font-size:14px;font-family:'IBM Plex Sans',sans-serif;outline:none;margin-bottom:10px"
          onkeydown="if(event.key==='Enter') authSetNewPassword()">
        <input id="auth-newpw2" type="password" placeholder="Ulangi password baru" autocomplete="new-password"
          style="width:100%;box-sizing:border-box;padding:10px 14px;border:1.5px solid #DCE3EE;border-radius:8px;font-size:14px;font-family:'IBM Plex Sans',sans-serif;outline:none;margin-bottom:12px"
          onkeydown="if(event.key==='Enter') authSetNewPassword()">
        <button id="auth-newpw-btn" onclick="authSetNewPassword()"
          style="width:100%;padding:11px;background:#1F5FD6;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">Simpan password</button>
      </div>

      <div id="auth-otp-step" style="display:none">
        <p style="color:#5B6B85;font-size:13px;margin:0 0 16px">
          Cek email Anda untuk kode 6 digit
        </p>
        <input id="auth-otp" type="text"
          placeholder="123456"
          maxlength="6"
          style="
            width:100%;box-sizing:border-box;
            padding:10px 14px;border:1.5px solid #DCE3EE;
            border-radius:8px;font-size:24px;
            letter-spacing:8px;text-align:center;
            font-family:'IBM Plex Mono',monospace;
            outline:none;margin-bottom:12px;
          "
          oninput="if(this.value.length===6) authVerifyOTP()"
        >
        <button id="auth-verify-btn"
          onclick="authVerifyOTP()"
          style="
            width:100%;padding:11px;
            background:#1F5FD6;color:#fff;
            border:none;border-radius:8px;
            font-size:14px;font-weight:600;cursor:pointer;
          "
        >Verifikasi</button>
        <button
          onclick="document.getElementById('auth-otp-step').style.display='none';document.getElementById('auth-email-step').style.display='block'"
          style="
            width:100%;padding:11px;margin-top:8px;
            background:none;color:#5B6B85;
            border:1px solid #DCE3EE;border-radius:8px;
            font-size:13px;cursor:pointer;
          "
        >← Kembali</button>
      </div>

      <div id="auth-msg" style="
        margin-top:12px;font-size:13px;
        color:#C2302B;min-height:20px;
      "></div>
    </div>
  </div>

  <!--
    MAIN APP CONTENT will be injected by app.js.
    The original mni-gudang.html body content is here.
    We use a separate app.js file that contains the extracted JS
    from the original mni-gudang.html.
  -->
  <div id="app-root"></div>

  <!-- Auth UI script (inline, no module needed) -->
  <script>
    let _authEmail = '';

    async function authSendOTP() {
      const emailEl = document.getElementById('auth-email');
      const msgEl = document.getElementById('auth-msg');
      const email = emailEl.value.trim().toLowerCase();
      if (!email || !email.includes('@')) {
        msgEl.textContent = 'Masukkan email yang valid.';
        return;
      }
      _authEmail = email;
      const btn = document.getElementById('auth-btn');
      btn.disabled = true;
      btn.textContent = 'Mengirim...';
      msgEl.textContent = '';

      try {
        // supabase-js mengembalikan { error } (tidak melempar). Tanpa pemeriksaan ini, UI tetap
        // mengatakan "cek email" walau pengiriman ditolak (mis. HTTP 429 batas email).
        const { error } = await window.__supabase.auth.signInWithOtp({
          email,
          options: { shouldCreateUser: false }
        });
        if (error) {
          const limited = error.status === 429 || /rate limit|too many|over_email/i.test(error.code || error.message || '');
          msgEl.textContent = limited
            ? 'Batas pengiriman email tercapai. Tunggu beberapa menit, atau masuk dengan password.'
            : (error.message || 'Gagal mengirim kode.');
          return;
        }
        document.getElementById('auth-email-step').style.display = 'none';
        document.getElementById('auth-otp-step').style.display = 'block';
      } catch (e) {
        msgEl.textContent = e.message || 'Gagal mengirim kode.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kirim Kode Masuk';
      }
    }

    // Muat ulang tepat sekali setelah login berhasil. Dipanggil langsung oleh pengendali login (bukan hanya oleh
    // onAuthStateChange) karena pendengar status auth baru terpasang setelah inisialisasi; login yang sangat cepat
    // bisa terjadi sebelum itu dan aplikasi tetap berjalan sebagai "Tamu" (ditemukan oleh CI, B-018).
    let _reloading = false;
    function reloadOnce() { if (_reloading) return; _reloading = true; location.reload(); }

    async function authPasswordLogin() {
      const email = document.getElementById('auth-email').value.trim().toLowerCase();
      const password = document.getElementById('auth-password').value;
      const msgEl = document.getElementById('auth-msg');
      if (!email || !email.includes('@')) { msgEl.textContent = 'Masukkan email yang valid.'; return; }
      if (!password) { msgEl.textContent = 'Masukkan password.'; return; }
      const btn = document.getElementById('auth-pw-btn');
      btn.disabled = true;
      btn.textContent = 'Masuk...';
      msgEl.textContent = '';
      try {
        const { error } = await window.__supabase.auth.signInWithPassword({ email, password });
        if (error) msgEl.textContent = 'Email atau password salah, atau akun belum dikonfirmasi.';
        else reloadOnce();
        // Bila berhasil, perubahan status auth memuat ulang halaman (lihat onAuthStateChange).
      } catch (e) {
        msgEl.textContent = e.message || 'Gagal masuk.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    }

    // Lupa password: kirim tautan pemulihan ke email. Tautan membuka halaman ini dengan #type=recovery.
    async function authForgot() {
      const email = document.getElementById('auth-email').value.trim().toLowerCase();
      const msgEl = document.getElementById('auth-msg');
      if (!email || !email.includes('@')) { msgEl.style.color = '#C2302B'; msgEl.textContent = 'Isi email Anda di kolom atas, lalu klik Lupa password.'; return; }
      msgEl.style.color = '#5B6B85'; msgEl.textContent = 'Mengirim...';
      try {
        const { error } = await window.__supabase.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/' });
        if (error) {
          const limited = error.status === 429 || /rate limit|too many|over_email/i.test(error.code || error.message || '');
          msgEl.style.color = '#C2302B';
          msgEl.textContent = limited ? 'Batas pengiriman email tercapai. Minta super admin mengatur ulang password Anda.' : 'Gagal mengirim. Minta super admin mengatur ulang password Anda.';
        } else {
          msgEl.textContent = 'Jika email terdaftar, tautan pembuatan password baru sudah dikirim. Belum masuk? Minta super admin mengatur ulang password Anda.';
        }
      } catch (e) { msgEl.style.color = '#C2302B'; msgEl.textContent = e.message || 'Gagal mengirim.'; }
    }

    // Tampil setelah pengguna membuka tautan pemulihan: buat password baru lalu masuk.
    async function authSetNewPassword() {
      const p1 = document.getElementById('auth-newpw').value, p2 = document.getElementById('auth-newpw2').value;
      const msgEl = document.getElementById('auth-msg');
      msgEl.style.color = '#C2302B';
      if (p1.length < 8) { msgEl.textContent = 'Password minimal 8 karakter.'; return; }
      if (p1 !== p2) { msgEl.textContent = 'Kedua password tidak sama.'; return; }
      const btn = document.getElementById('auth-newpw-btn');
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      const { error } = await window.__supabase.auth.updateUser({ password: p1 });
      btn.disabled = false; btn.textContent = 'Simpan password';
      if (error) { msgEl.textContent = /same|different/i.test(error.message) ? 'Password baru harus berbeda dari password lama.' : 'Gagal menyimpan password: ' + error.message; return; }
      history.replaceState(null, '', location.pathname);
      reloadOnce();
    }

    // Login password hanya untuk Supabase sungguhan; mock lokal memakai kode lokal.
    document.addEventListener('DOMContentLoaded', () => {
      if (window.__ENV && window.__ENV.LOCAL_MOCK === '1') {
        const b = document.getElementById('auth-pw-block');
        if (b) b.style.display = 'none';
      }
    });

    async function authVerifyOTP() {
      const otp = document.getElementById('auth-otp').value.trim();
      const msgEl = document.getElementById('auth-msg');
      if (otp.length !== 6) { msgEl.textContent = 'Kode harus 6 digit.'; return; }

      const btn = document.getElementById('auth-verify-btn');
      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';
      msgEl.textContent = '';

      try {
        const { error } = await window.__supabase.auth.verifyOtp({
          email: _authEmail,
          token: otp,
          type: 'email'
        });
        if (error) throw error;
        reloadOnce();
      } catch (e) {
        msgEl.textContent = 'Kode salah atau expired. Coba lagi.';
        document.getElementById('auth-otp').value = '';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Verifikasi';
      }
    }

    // Listen for auth state from the adapter
    const _recovery = /type=recovery/.test(location.hash);
    document.addEventListener('DOMContentLoaded', () => {
      // Wait for supabase to be available
      const waitSupabase = setInterval(() => {
        if (window.__supabase) {
          clearInterval(waitSupabase);
          const gate = document.getElementById('auth-gate');
          // app.js membaca user/sesi sekali saat boot. Setelah login atau logout kita muat ulang
          // halaman agar identitas, role, dan data dibaca ulang dari sesi yang benar.
          window.__supabase.auth.getSession().then(({ data: { session } }) => {
            let hadSession = !!session;
            gate.style.display = session && !_recovery ? 'none' : 'flex';
            const showNewPw = () => {
              gate.style.display = 'flex';
              ['auth-email-step', 'auth-otp-step'].forEach((id) => { document.getElementById(id).style.display = 'none'; });
              document.getElementById('auth-newpw-step').style.display = 'block';
              document.getElementById('auth-msg').textContent = '';
            };
            if (_recovery) showNewPw();
            window.__supabase.auth.onAuthStateChange((event, s) => {
              if (event === 'PASSWORD_RECOVERY') { hadSession = true; showNewPw(); return; }
              if (_recovery && event === 'SIGNED_IN') { hadSession = true; showNewPw(); return; }
              if (event === 'SIGNED_IN' && !hadSession && s) { hadSession = true; reloadOnce(); return; }
              if (event === 'SIGNED_OUT' && hadSession) { hadSession = false; reloadOnce(); return; }
              gate.style.display = s ? 'none' : 'flex';
            });
          });
        }
      }, 100);
    });
  </script>

  <!--
    NOTE: The main app script (app.js) is the extracted content from
    mni-gudang.html. During build, Vite will process it.
    See: scripts/extract-app.js to generate public/app.js from mni-gudang.html
  -->
  <script>
    // Load order matters: CSS -> body markup -> app.js (it queries the DOM on load).
    (async () => {
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "/app.css";
      document.head.appendChild(css);
      // Adapter (modul) harus selesai lebih dulu: app.js membaca window.claude saat dimuat.
      await new Promise((ok) => { const t = setInterval(() => { if (window.claude) { clearInterval(t); ok(); } }, 20); });
      const res = await fetch("/app-body.html");
      if (!res.ok) throw new Error("app-body.html missing; run npm run extract");
      document.getElementById("app-root").innerHTML = await res.text();
      const s = document.createElement("script");
      s.src = "/app.js";
      document.body.appendChild(s);
    })().catch((e) => console.error("[mni-app] bootstrap failed:", e));
  </script>
</body>
</html>
